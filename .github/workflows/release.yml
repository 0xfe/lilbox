name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA (provided by just release)
        required: true
        type: string
      version:
        description: Cargo.toml version without v (provided by just release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate requested source and version
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          version = os.environ['REQUESTED_VERSION']
          assert os.environ['GITHUB_REF'] == 'refs/heads/main', 'Release must run from main'
          assert os.environ['REQUESTED_COMMIT'] == os.environ['GITHUB_SHA'], 'main moved; request again'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Expected stable X.Y.Z'
          package = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']
          assert package['version'] == version, 'Cargo.toml version mismatch'
          assert f'## {version} — ' in pathlib.Path('CHANGELOG.md').read_text(), 'Missing changelog entry'
          PY
          existing_tag=$(git ls-remote origin "refs/tags/v$REQUESTED_VERSION")
          test -z "$existing_tag" || {
            echo 'Release tag already exists; bump the version first.' >&2
            exit 1
          }
  build:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      release: true
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: lilbox-*
          merge-multiple: true
          path: dist
      - name: Validate complete asset set
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin',
                     'aarch64-unknown-linux-musl', 'x86_64-unknown-linux-musl']
          expected = set()
          for target in targets:
              name = f"lilbox-{os.environ['VERSION']}-{target}.tar.gz"
              archive = pathlib.Path('dist') / name
              checksum = archive.with_name(name + '.sha256')
              assert checksum.read_text() == hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + name + '\n'
              expected.update([name, name + '.sha256'])
          assert {p.name for p in pathlib.Path('dist').iterdir()} == expected, 'Unexpected or missing assets'
          PY
      - name: Publish only after every target passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          # Create the exact tested tag atomically; an existing ref is an error.
          gh api "repos/$GH_REPO/git/refs" --method POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$COMMIT" --silent
          # gh stages uploads as a draft and publishes only after uploads succeed.
          gh release create "v$VERSION" dist/* install.sh \
            --verify-tag --title "lilbox v$VERSION" --generate-notes --latest
