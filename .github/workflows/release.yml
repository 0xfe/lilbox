name: Release
run-name: Release v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA (provided by just release)
        required: true
        type: string
      version:
        description: Cargo.toml version without v (provided by just release)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate requested source and version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Release must run from main.' >&2; exit 1; }
          test "$REQUESTED_COMMIT" = "$GITHUB_SHA" || { echo 'main moved; request again.' >&2; exit 1; }
          python3 scripts/version.py check "$REQUESTED_VERSION"
  build:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      release: true
  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: lilbox-*
          merge-multiple: true
          path: dist
      - name: Validate complete asset set
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib
          targets = ['aarch64-apple-darwin', 'x86_64-apple-darwin',
                     'aarch64-unknown-linux-musl', 'x86_64-unknown-linux-musl']
          expected = set()
          for target in targets:
              name = f"lilbox-{os.environ['VERSION']}-{target}.tar.gz"
              archive = pathlib.Path('dist') / name
              checksum = archive.with_name(name + '.sha256')
              assert checksum.read_text() == hashlib.sha256(archive.read_bytes()).hexdigest() + '  ' + name + '\n'
              expected.update([name, name + '.sha256'])
          assert {p.name for p in pathlib.Path('dist').iterdir()} == expected, 'Unexpected or missing assets'
          PY
      - name: Publish only after every target passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          # Recheck history after the builds in case a version was reserved meanwhile.
          python3 scripts/version.py check "$VERSION"
          # Create the exact tested tag atomically; an existing ref is an error.
          gh api "repos/$GH_REPO/git/refs" --method POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$COMMIT" --silent
          # gh stages uploads as a draft and publishes only after uploads succeed.
          gh release create "v$VERSION" dist/* install.sh \
            --verify-tag --title "lilbox v$VERSION" --generate-notes --latest
