name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux sandbox and test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3 ca-certificates
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Real Seatbelt enforcement
        if: runner.os == 'macOS'
        run: cargo test --locked --test seatbelt -- --ignored --test-threads=1
      - name: Real bubblewrap enforcement
        if: runner.os == 'Linux'
        run: cargo test --locked --test bubblewrap -- --ignored --test-threads=1
      - name: Package release
        run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lilbox-${{ matrix.os }}
          path: dist/*
