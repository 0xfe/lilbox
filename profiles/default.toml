# Standalone profile; also built into lilbox when this file is absent.
version = 1
mode = "open"
network = "allow"

[filesystem]
protect_credentials = true
# Additional absolute, ~/, ${HOME}/, ${CWD}/, or working-directory-relative paths.
deny = []

[environment]
inherit = true
# Explicitly pass an otherwise scrubbed variable, only if you trust the agent:
# keep = ["ANTHROPIC_API_KEY"]
keep = []
drop = []

[runtime]
temporary_directory = true
