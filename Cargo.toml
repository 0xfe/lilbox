[package]
name = "lilbox"
version = "0.4.4"
edition = "2024"
rust-version = "1.85"
description = "A small, configurable OS sandbox for coding agents"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
