# An online coding profile with extra private paths and environment drops.
# Parent: global default.toml when present, otherwise the embedded native default.
version = 1
extends = "default"

[filesystem]
# Appended to inherited denies; the closed default grants only configured paths.
deny = ["~/Documents/Personal", "${CWD}/production.env"]

[environment]
drop = ["MY_COMPANY_*"]

[environment.set]
# Non-secret settings merge by exact variable name in child profiles.
EDITOR = "vi"
PAGER = "less"
