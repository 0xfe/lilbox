# Closed filesystem with unrestricted networking and native certificate services.
# Copy workspace-offline.toml alongside this file.
version = 1
extends = "workspace-offline"
network = "allow"

[environment]
# Appends to the parent's small keep list; general inheritance stays disabled.
# Proxy URLs may contain credentials. Remove entries you do not need.
keep = ["HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "SSL_CERT_FILE", "SSL_CERT_DIR", "NODE_EXTRA_CA_CERTS", "CURL_CA_BUNDLE", "REQUESTS_CA_BUNDLE", "AWS_CA_BUNDLE"]
# Custom CA bundles outside the inherited read grants need explicit allow_read.
# Agents also need grants for their executable/runtime, state, and authentication.
